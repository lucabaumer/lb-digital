<style>
  :root{
    --bg:#121214; --panel:#1E1E22; --panel2:#2A2A30; --line:#2E2E34;
    --ink:#F5F5F7; --mut:#8E8E97;
    --accent:#CB3A31; --accent-soft:rgba(203,58,49,.16);
    --green:#32D74B; --gold:#FFC93E;
    --f:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--f);min-height:100%;-webkit-font-smoothing:antialiased}
  body{padding-bottom:100px}

  header{padding:26px 22px 10px}
  .htitle{font-size:22px;font-weight:800;letter-spacing:-.02em}

  main{padding:8px 22px 0}

  .datenav{display:flex;align-items:center;gap:10px;margin-top:10px;margin-bottom:16px}
  .navbtn{flex:0 0 auto;width:40px;height:40px;border-radius:13px;border:none;background:var(--panel);color:var(--ink);font-size:17px;font-weight:800;cursor:pointer}
  .datelabel{flex:1;text-align:center;font-weight:800;font-size:16px;letter-spacing:-.01em}
  .todaybtn{flex:0 0 auto;padding:10px 14px;border-radius:13px;border:none;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12.5px;font-family:var(--f);cursor:pointer}
  .daytype{font-size:12.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;text-align:center;margin-bottom:10px}
  .gymrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px}
  .gymrow label{font-size:12px;color:var(--mut);font-weight:700}
  #gymSelect{padding:9px 12px;border-radius:12px;border:none;background:var(--panel2);color:var(--ink);font-family:var(--f);font-weight:800;font-size:13px}

  .excat{flex:0 0 auto;padding:5px 10px;border-radius:20px;border:none;font-family:var(--f);font-weight:800;font-size:10.5px;cursor:pointer;white-space:nowrap}
  .excat.gym{background:var(--accent-soft);color:var(--accent)}
  .excat.global{background:rgba(142,142,151,.16);color:var(--mut)}
  .exest{font-size:11.5px;color:var(--gold);font-weight:800;margin-top:2px}

  .gymmgmt-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .gymmgmt-row:last-child{border-bottom:none}
  .gymmgmt-row .gn{flex:1;font-weight:700;font-size:14.5px}
  .gymmgmt-row .gn small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
  .gymmgmt-row .gbtns{display:flex;gap:6px}
  .gymmgmt-row .gbtns button{flex:0 0 auto;width:30px;height:30px;border-radius:10px;border:none;background:var(--panel2);color:var(--mut);font-weight:800;font-size:12px;cursor:pointer}
  .gymaddform{display:flex;gap:8px;margin-top:14px}
  .gymaddform input{padding:12px;border-radius:13px;border:none;background:var(--panel2);color:var(--ink);font-family:var(--f);font-weight:700;font-size:14px;min-width:0}
  .gymaddform input:first-child{flex:1.3}
  .gymaddform input:nth-child(2){flex:1}
  .gymaddform .mini{flex:0 0 auto;padding:12px 16px;border-radius:13px;border:none;background:var(--green);color:#0E0E11;font-weight:900;font-family:var(--f);font-size:14px;cursor:pointer}

  .gymfilter{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .gymfilter label{font-size:12px;color:var(--mut);font-weight:700}
  #gymFilterSelect{flex:1;padding:12px;border-radius:13px;border:none;background:var(--panel2);color:var(--ink);font-family:var(--f);font-weight:800;font-size:13.5px}

  .planrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .planrow:last-child{border-bottom:none}
  .planrow .pn{flex:1;font-weight:700;font-size:14.5px}
  .planrow .pr{font-size:12.5px;color:var(--mut);font-weight:700;white-space:nowrap}
  .planaddform{display:flex;gap:8px;margin-top:14px}
  .planaddform input{padding:12px;border-radius:13px;border:none;background:var(--panel2);color:var(--ink);font-family:var(--f);font-weight:700;font-size:14px;min-width:0}
  .planaddform input[type=text]{flex:1}
  .planaddform input[type=number]{width:52px;text-align:center}
  .planaddform .mini{flex:0 0 auto;padding:12px 16px;border-radius:13px;border:none;background:var(--green);color:#0E0E11;font-weight:900;font-family:var(--f);font-size:14px;cursor:pointer}

  .card{background:var(--panel);border-radius:26px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
  h3{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px}

  .excard{background:var(--panel);border-radius:22px;padding:18px;margin-bottom:14px}
  .exhead{display:flex;align-items:center;gap:10px}
  .exname{font-weight:800;font-size:17px;letter-spacing:-.01em;flex:1}
  .exdel{flex:0 0 auto;background:none;border:none;color:var(--mut);font-size:18px;font-weight:800;cursor:pointer;padding:2px 6px}
  .exlast{font-size:13px;color:var(--green);font-weight:700;margin-top:8px}
  .exsug{font-size:13px;color:var(--gold);font-weight:700;margin-top:6px}
  .setlist{margin-top:10px}
  .setrow2{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .setrow2:last-child{border-bottom:none}
  .setnum2{font-size:12.5px;font-weight:800;color:var(--mut);width:46px;flex:0 0 auto}
  .setval2{flex:1;font-size:14.5px;font-weight:700}
  .setundo{flex:0 0 auto;width:30px;height:30px;border-radius:10px;border:none;background:var(--panel2);color:var(--mut);font-weight:800;font-size:12px;cursor:pointer}
  .addset{display:flex;gap:8px;margin-top:12px}
  .addset input{padding:12px;border-radius:13px;border:none;background:var(--panel2);color:var(--ink);font-family:var(--f);font-weight:700;font-size:14px}
  .addset input[type=number]{width:72px;text-align:center}
  .addset input[type=text]{flex:1;min-width:0}
  .addset input::placeholder{color:#5E5E67;font-weight:600}
  .setok{flex:0 0 auto;width:40px;height:42px;border-radius:13px;border:none;background:var(--green);color:#0E0E11;font-weight:900;font-size:17px;cursor:pointer}

  .addexbtn{width:100%;padding:15px;border-radius:15px;border:none;background:var(--panel2);color:var(--ink);font-weight:800;font-size:14.5px;font-family:var(--f);cursor:pointer;margin-top:4px}
  .addexform{margin-top:10px;display:flex;gap:8px}
  .addexform.hide{display:none}
  .addexform input{flex:1;padding:14px;border-radius:14px;border:none;background:var(--panel2);color:var(--ink);font-family:var(--f);font-size:14.5px;font-weight:700;min-width:0}
  .addexform .mini{flex:0 0 auto;padding:14px 16px;border-radius:14px;border:none;background:var(--green);color:#0E0E11;font-weight:900;font-family:var(--f);font-size:14px;cursor:pointer}

  .empty{font-size:14px;color:var(--mut);font-weight:600;padding:20px 2px;text-align:center}

  .statrow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700}
  .statrow:last-child{border-bottom:none}
  .statrow span{color:var(--mut);font-weight:600}
  .statrow b{font-weight:900;text-align:right}

  .monthnav{display:flex;align-items:center;gap:10px;margin-top:10px;margin-bottom:16px}

  /* Balkendiagramm: Volumen pro Übung */
  .hbar-chart{display:flex;flex-direction:column;gap:14px}
  .hbar-row{display:flex;flex-direction:column;gap:6px}
  .hbar-label{font-size:13px;font-weight:700;color:var(--ink)}
  .hbar-barwrap{display:flex;align-items:center;gap:10px}
  .hbar-track{flex:1;height:18px;background:var(--panel2);border-radius:9px;overflow:hidden}
  .hbar-fill{height:100%;background:var(--accent);border-radius:0 9px 9px 0;min-width:4px}
  .hbar-value{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--ink);white-space:nowrap}

  /* Säulendiagramm: Volumen pro Training */
  .vol-readout{font-size:13px;color:var(--mut);font-weight:700;margin-bottom:10px;min-height:18px}
  .vbar-plot{position:relative;height:150px;display:flex;gap:6px;border-bottom:1px solid var(--line);padding-top:20px}
  .vbar-avgline{position:absolute;left:0;right:0;border-top:1px dashed var(--mut);z-index:1}
  .vbar-avgline span{position:absolute;right:0;top:-18px;font-size:10.5px;font-weight:800;color:var(--mut);background:var(--panel);padding:0 4px}
  .vbar-col{flex:1;min-width:10px;max-width:28px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;z-index:2}
  .vbar-fill{width:100%;max-width:22px;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px;transition:filter .15s}
  .vbar-col.hi .vbar-fill{filter:brightness(1.3)}
  .vbar-axis{display:flex;gap:6px;margin-top:6px}
  .vbar-axis span{flex:1;min-width:10px;max-width:28px;text-align:center;font-size:10px;color:var(--mut);font-weight:700}

  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(18,18,20,.9);backdrop-filter:blur(20px);
    border-top:1px solid var(--line);padding:11px 6px calc(12px + env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;border:none;color:var(--mut);font-family:var(--f);font-weight:700;
    font-size:10.5px;letter-spacing:.01em;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
  nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:var(--accent)}
  .hide{display:none}
</style>
</head>
<body>

<header>
  <div class="htitle">Training-Log</div>
</header>

<main>
  <section id="view-log">
    <div class="datenav">
      <button class="navbtn" onclick="prevDay()">‹</button>
      <div class="datelabel" id="dateLabel">…</div>
      <button class="navbtn" onclick="nextDay()">›</button>
      <button class="todaybtn hide" id="todayBtn" onclick="gotoToday()">Heute</button>
    </div>
    <div class="daytype hide" id="dayTypeLabel"></div>
    <div class="gymrow">
      <label for="gymSelect">Gym:</label>
      <select id="gymSelect" onchange="setDayGym(this.value)"></select>
    </div>
    <div id="logList"></div>
    <button class="addexbtn" onclick="toggleAddEx()">+ Übung hinzufügen</button>
    <div class="addexform hide" id="addExForm">
      <input type="text" id="newExName" placeholder="Name der Übung" list="exNames"
        onkeydown="if(event.key==='Enter')confirmAddEx()">
      <datalist id="exNames"></datalist>
      <button class="mini" onclick="confirmAddEx()">+</button>
    </div>
  </section>

  <section id="view-month" class="hide">
    <div class="monthnav">
      <button class="navbtn" onclick="prevMonth()">‹</button>
      <div class="datelabel" id="monthLabel">…</div>
      <button class="navbtn" onclick="nextMonth()">›</button>
    </div>
    <div class="gymfilter">
      <label for="gymFilterSelect">Gym:</label>
      <select id="gymFilterSelect" onchange="setGymFilter(this.value)"></select>
    </div>
    <div class="card">
      <h3>Überblick</h3>
      <div id="monthOverview"></div>
    </div>
    <div class="card">
      <h3>Volumen pro Übung</h3>
      <div id="exChart"></div>
    </div>
    <div class="card">
      <h3>Volumen pro Training</h3>
      <div class="vol-readout" id="volReadout">Tippe auf einen Balken für den genauen Tag</div>
      <div id="volChart"></div>
    </div>
    <div class="card">
      <h3>Pro Übung</h3>
      <div id="monthExList"></div>
    </div>
  </section>

  <section id="view-plan" class="hide">
    <div class="card">
      <h3>Gyms</h3>
      <div id="gymList"></div>
      <div class="gymaddform">
        <input type="text" id="newGymName" placeholder="Name">
        <input type="text" id="newGymLoc" placeholder="Ort (optional)">
        <button class="mini" onclick="addGym()">+</button>
      </div>
    </div>
    <div class="card">
      <h3 id="planNameA">…</h3>
      <div id="planListA"></div>
      <div class="planaddform">
        <input type="text" id="planNewNameA" placeholder="Übung">
        <input type="number" id="planNewLowA" placeholder="von">
        <input type="number" id="planNewHighA" placeholder="bis">
        <button class="mini" onclick="addPlanItem('A')">+</button>
      </div>
    </div>
    <div class="card">
      <h3 id="planNameB">…</h3>
      <div id="planListB"></div>
      <div class="planaddform">
        <input type="text" id="planNewNameB" placeholder="Übung">
        <input type="number" id="planNewLowB" placeholder="von">
        <input type="number" id="planNewHighB" placeholder="bis">
        <button class="mini" onclick="addPlanItem('B')">+</button>
      </div>
    </div>
  </section>
</main>

<nav>
  <button id="tab-log" class="on"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Log</button>
  <button id="tab-month"><svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Monat</button>
  <button id="tab-plan"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Plan</button>
</nav>

<script>
/* ---------- Storage ---------- */
const hasCS=typeof window.storage!=="undefined"&&window.storage&&window.storage.get;
async function sget(k){
  if(hasCS){try{const r=await window.storage.get(k);return r&&r.value?JSON.parse(r.value):null}catch(e){return null}}
  try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}
}
async function sset(k,v){
  if(hasCS){try{await window.storage.set(k,JSON.stringify(v));return}catch(e){}}
  try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}
}

/* ---------- Datum-Helfer ---------- */
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const MN=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function todayKey(){return new Date().toISOString().slice(0,10)}
function fmtDate(k){
  const d=new Date(k+"T00:00:00");
  return WD[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
}
function fmtDateShort(k){
  const d=new Date(k+"T00:00:00");
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".";
}
function shiftDate(k,delta){
  const d=new Date(k+"T00:00:00");d.setDate(d.getDate()+delta);
  return d.toISOString().slice(0,10);
}
function shiftMonth(k,delta){
  const [y,m]=k.split("-").map(Number);
  const d=new Date(y,m-1+delta,1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function fmtMonth(k){
  const [y,m]=k.split("-").map(Number);
  return MN[m-1]+" "+y;
}
function fmtNum(n){return (Math.round(n*10)/10).toString();}
function fmtKg(n){return Math.round(n).toLocaleString("de-DE")+" kg";}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- State ---------- */
let S={log:{},plan:{},dayType:{},gyms:[],dayGym:{},exCategory:{},lastGym:null};
let curDate=todayKey();
let curMonth=todayKey().slice(0,7);
let curGymFilter="all";

/* ---------- Gyms & pro-Gym-/übergreifende Übungen ---------- */
// Freie Gewichte & Körpergewicht: gym-übergreifend. Alles andere (Standard):
// pro Gym, da Maschinen/Kabelzüge sich unterscheiden. Pro Übung manuell umstellbar.
const GLOBAL_EXERCISES=["bankdrücken","seitheben","preacher curls","hammer curls",
  "schrägbank-rudern kh","beinheben","preacher curls einarmig kh","dips"];
function genGymId(){return "gym"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function exCategory(name){
  const key=normName(name);
  if(S.exCategory[key])return S.exCategory[key];
  return GLOBAL_EXERCISES.includes(key)?"global":"gym";
}
window.toggleExCategory=async(name)=>{
  const key=normName(name);
  S.exCategory[key]=exCategory(name)==="gym"?"global":"gym";
  await sset("v3-excat",S.exCategory);
  renderLog();
};
window.addGym=async()=>{
  const nameEl=document.getElementById("newGymName"),locEl=document.getElementById("newGymLoc");
  const name=nameEl.value.trim();
  if(!name)return;

/* ---------- Übungs-Helfer ---------- */
function normName(n){return n.trim().toLowerCase();}
function fmtSet(s){return (s.w!=null&&s.w!=="")?`${s.w} kg × ${s.r}`:`${s.r} Wdh`;}
function lastForExercise(name,beforeDate,gymId){
  const target=normName(name);
  const dates=Object.keys(S.log).filter(d=>d<beforeDate).sort().reverse();
  for(const d of dates){
    if(gymId!==undefined&&S.dayGym[d]!==gymId)continue;
    const ex=(S.log[d]||[]).find(e=>normName(e.name)===target);
    if(ex&&ex.sets&&ex.sets.length)return {date:d,sets:ex.sets,gym:S.dayGym[d]};
  }
  return null;
}
function allExerciseNames(){
  const map=new Map();
  Object.keys(S.log).sort().forEach(d=>{
    (S.log[d]||[]).forEach(e=>{map.set(normName(e.name),e.name);});
  });
  return [...map.values()];
}
function setsTotal(sets,hasWeight){
  return sets.reduce((s,x)=>s+(hasWeight?(x.w!=null?x.w*(parseFloat(x.r)||0):0):(parseFloat(x.r)||0)),0);
}
function compareToLast(todaySets,lastSets){
  if(!todaySets.length||!lastSets||!lastSets.length)return null;
  const hasWeight=todaySets.some(s=>s.w!=null)||lastSets.some(s=>s.w!=null);
  const todayVal=setsTotal(todaySets,hasWeight),lastVal=setsTotal(lastSets,hasWeight);
  if(!lastVal)return null;
  return {pct:Math.round((todayVal-lastVal)/lastVal*100)};
}

/* ---------- Gewicht/Wdh-Vorschlag ---------- */
// Zielbereiche kommen aus dem editierbaren Plan (Tab "Plan"). Bankdrücken (Kraftfokus,
// nicht Teil eines Plan-Tages) ist fest hinterlegt. Alles ohne Zielbereich fällt auf
// einen generischen Hypertrophie-Bereich zurück.
function buildTargetReps(){
  const t={"bankdrücken":[5,8]};
  ["A","B"].forEach(k=>{
    ((S.plan[k]||{}).items||[]).forEach(it=>{t[normName(it.name)]=[it.low,it.high];});
  });
  return t;
}
function roundHalf(n){return Math.round(n*2)/2;}
function latestSessionForExercise(name,gymId){return lastForExercise(name,"9999-12-31",gymId);}
// Liefert die relevante letzte Session für eine Übung am aktuell gewählten Tag/Gym,
// inkl. Kennzeichnung, ob es sich um eine Schätzung aus einem anderen Gym handelt.
function relevantLast(name,beforeDate){
  if(exCategory(name)!=="gym")return{session:lastForExercise(name,beforeDate),estimate:false};
  const gymId=S.dayGym[curDate];
  const own=lastForExercise(name,beforeDate,gymId);
  if(own)return{session:own,estimate:false};
  return{session:lastForExercise(name,beforeDate),estimate:true};
}
function suggestNext(name){
  const gymId=exCategory(name)==="gym"?S.dayGym[curDate]:undefined;
  let last=latestSessionForExercise(name,gymId);
  let estimate=false;
  if(!last&&gymId!==undefined){last=latestSessionForExercise(name);estimate=!!last;}
  if(!last)return null;
  const sets=last.sets.filter(Boolean);
  if(!sets.length)return null;
  const hasWeight=sets.some(s=>s.w!=null);
  const target=buildTargetReps()[normName(name)];
  if(hasWeight){
    const topW=Math.max(...sets.filter(s=>s.w!=null).map(s=>s.w));
    const bestReps=Math.max(...sets.filter(s=>s.w===topW).map(s=>parseFloat(s.r)||0));
    const lower=target?target[0]:8,upper=target?target[1]:12;
    if(bestReps>=upper)return{weight:roundHalf(topW+2.5),reps:lower,up:true,estimate};
    return{weight:topW,reps:Math.min(upper,bestReps+1),up:false,estimate};
  }else{
    const bestReps=Math.max(...sets.map(s=>parseFloat(s.r)||0));
    const upper=target?target[1]:15;
    if(bestReps>=upper)return{weight:null,reps:bestReps,up:true,harder:true,estimate};
    return{weight:null,reps:bestReps+1,up:false,estimate};
  }
}

function renderLog(){
  const listEl=document.getElementById("logList");
  const saved={};
  if(listEl)listEl.querySelectorAll("input[id]").forEach(i=>{saved[i.id]=i.value;});

  document.getElementById("dateLabel").textContent=fmtDate(curDate)+(curDate===todayKey()?" · Heute":"");
  document.getElementById("todayBtn").classList.toggle("hide",curDate===todayKey());

  const dt=S.dayType[curDate];
  const dtLabel=document.getElementById("dayTypeLabel");
  dtLabel.classList.toggle("hide",!dt||!S.plan[dt]);
  if(dt&&S.plan[dt])dtLabel.textContent=S.plan[dt].name;
  renderGymSelect();

  const list=S.log[curDate]||[];
  let h="";
  if(!list.length){
    h+=`<div class="empty">Noch keine Übungen für diesen Tag.<br>Leg los mit „+ Übung hinzufügen".</div>`;
  }
  list.forEach((ex,idx)=>{
    const cat=exCategory(ex.name);
    const {session:last,estimate}=relevantLast(ex.name,curDate);
    const cmp=(last&&!estimate)?compareToLast(ex.sets,last.sets):null;
    const pctHtml=cmp?` <span style="font-weight:800;color:${cmp.pct>0?"var(--green)":cmp.pct<0?"var(--accent)":"var(--mut)"}">${cmp.pct>0?"▲ +":cmp.pct<0?"▼ ":"± "}${cmp.pct}%</span>`:"";
    const lastGymTxt=last&&last.gym?gymName(last.gym):null;
    const sug=!ex.sets.length?suggestNext(ex.name):null;
    let sugTxt="";
    if(sug){
      if(sug.harder)sugTxt=`Ziel: ${sug.reps} Wdh erreicht – Erschwerung/Zusatzgewicht probieren`;
      else if(sug.weight!=null)sugTxt=`Ziel: ${sug.weight} kg × ${sug.reps}${sug.up?" (Gewicht hoch!)":""}`;
      else sugTxt=`Ziel: ${sug.reps} Wdh`;
    }
    h+=`<div class="excard">
      <div class="exhead">
        <div class="exname">${esc(ex.name)}</div>
        <button class="excat ${cat}" onclick="toggleExCategory('${ex.name.replace(/'/g,"\\'")}')">${cat==="gym"?"📍 Pro Gym":"🌐 Übergreifend"}</button>
        <button class="exdel" onclick="deleteExercise('${curDate}',${idx})">✕</button>
      </div>
      ${last?`<div class="exlast">Letztes Mal (${fmtDateShort(last.date)}${estimate&&lastGymTxt?", "+lastGymTxt:""}): ${last.sets.map(fmtSet).join(" · ")}${pctHtml}</div>`:""}
      ${estimate&&last?`<div class="exest">≈ Schätzung – in diesem Gym noch keine Daten für diese Übung</div>`:""}
      ${sugTxt?`<div class="exsug">${sugTxt}${sug&&sug.estimate?" (Schätzung)":""}</div>`:""}
      ${ex.sets.length?`<div class="setlist">${ex.sets.map((s,si)=>
        `<div class="setrow2">
          <span class="setnum2">Satz ${si+1}</span>
          <span class="setval2">${fmtSet(s)}</span>
          <button class="setundo" onclick="deleteSet('${curDate}',${idx},${si})">✕</button>
        </div>`).join("")}</div>`:""}
      <div class="addset">
        <input type="number" step="0.5" placeholder="kg" id="aw-${idx}">
        <input type="text" placeholder="Wdh" id="ar-${idx}" onkeydown="if(event.key==='Enter')addSet('${curDate}',${idx})">
        <button class="setok" onclick="addSet('${curDate}',${idx})">✓</button>
      </div>
    </div>`;
  });
  listEl.innerHTML=h;
  Object.keys(saved).forEach(id=>{const el=document.getElementById(id);if(el&&saved[id])el.value=saved[id];});

  document.getElementById("exNames").innerHTML=allExerciseNames().map(n=>`<option value="${esc(n)}">`).join("");
}

function monthStats(){
  const dates=Object.keys(S.log).filter(d=>d.startsWith(curMonth)&&(curGymFilter==="all"||S.dayGym[d]===curGymFilter)).sort();
  let totalVol=0,totalSets=0;
  const perEx={};
  const dayVol=[];
  dates.forEach(d=>{
    let dVol=0;
    (S.log[d]||[]).forEach(ex=>{
      const key=normName(ex.name);
      if(!perEx[key])perEx[key]={name:ex.name,sets:0,maxW:null,vol:0};
      (ex.sets||[]).forEach(s=>{
        totalSets++;
        perEx[key].sets++;
        if(s.w!=null){
          const v=s.w*(parseFloat(s.r)||0);
          totalVol+=v;dVol+=v;perEx[key].vol+=v;
          if(perEx[key].maxW===null||s.w>perEx[key].maxW)perEx[key].maxW=s.w;
        }
      });
    });
    dayVol.push({date:d,vol:dVol});
  });
  const avgVol=dates.length?totalVol/dates.length:0;
  return {days:dates.length,totalVol,totalSets,avgVol,dayVol,
    perEx:Object.values(perEx).sort((a,b)=>b.sets-a.sets)};
}

  const maxVol=Math.max(...data.map(d=>d.vol));

    `<div class="hbar-row">
      <div class="hbar-label">${esc(e.name)}</div>

        <span class="hbar-value">${fmtKg(e.vol)}</span>
      </div>
    </div>`).join("")}</div>`;
}
function renderVolumeChart(st){
  const data=st.dayVol.filter(d=>d.vol>0);

  const avgTop=100-(st.avgVol/maxVol*100);
  el.innerHTML=`
    <div class="vbar-plot">
      <div class="vbar-avgline" style="top:${avgTop}%"><span>Ø ${fmtKg(st.avgVol)}</span></div>
      ${data.map(d=>{
        const h=Math.max(3,d.vol/maxVol*100);
        return `<div class="vbar-col" onclick="tapVolBar(this,'${fmtDateShort(d.date)}','${fmtKg(d.vol)}')">
          <div class="vbar-fill" style="height:${h}%"></div>

}

/* ---------- Default-Gyms & historische Gym-Zuordnung ---------- */
const DEFAULT_GYMS=[
  {id:"waldkirch",name:"Waldkirch",location:"Haupt-Gym"},
  {id:"gutach",name:"Fitness Pur",location:"Gutach"}
];
const SEED_DAYGYM_GUTACH=["2026-10-11","2026-10-15","2026-11-08"];

/* ---------- Boot ---------- */
async function boot(){
  S.log=(await sget("v3-log"))||{};
  S.plan=(await sget("v3-plan"))||DEFAULT_PLAN;
  S.dayType=(await sget("v3-daytype"))||{};
  S.gyms=(await sget("v3-gyms"))||DEFAULT_GYMS;
  S.dayGym=(await sget("v3-daygym"))||{};
  S.exCategory=(await sget("v3-excat"))||{};
  S.lastGym=(await sget("v3-lastgym"))||null;
  const imported=await sget("v3-seed-import1");
  if(!imported){
    Object.keys(SEED_IMPORT).forEach(d=>{
      S.log[d]=SEED_IMPORT[d].map(e=>({name:e.name,sets:e.sets.map(s=>({w:s.w,r:s.r}))}));
      S.dayGym[d]=SEED_DAYGYM_GUTACH.includes(d)?"gutach":"waldkirch";
    });
    S.dayType["2026-11-08"]="A";
    S.lastGym=S.dayGym["2026-11-08"];
    await sset("v3-log",S.log);
    await sset("v3-plan",S.plan);
    await sset("v3-daytype",S.dayType);
    await sset("v3-gyms",S.gyms);
    await sset("v3-daygym",S.dayGym);
    await sset("v3-lastgym",S.lastGym);
    await sset("v3-seed-import1",true);
  }

  curDate=todayKey();curMonth=todayKey().slice(0,7);
  // Nächsten Trainingstyp automatisch vorbelegen, wenn heute noch nichts eingetragen ist.
  if(!S.log[curDate]||!S.log[curDate].length){
    const taggedDates=Object.keys(S.dayType).filter(d=>d<curDate).sort();
    const lastType=taggedDates.length?S.dayType[taggedDates[taggedDates.length-1]]:null;
    const nextType=lastType==="A"?"B":"A";
    if(S.plan[nextType]&&S.plan[nextType].items.length){
      S.log[curDate]=S.plan[nextType].items.map(it=>({name:it.name,sets:[]}));
      S.dayType[curDate]=nextType;
      if(S.lastGym)S.dayGym[curDate]=S.lastGym;
      await sset("v3-log",S.log);
      await sset("v3-daytype",S.dayType);
      await sset("v3-daygym",S.dayGym);
    }
  }
  renderLog();
}
boot();
