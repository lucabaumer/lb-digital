<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121214; --panel:#1E1E22; --panel2:#2A2A30; --line:#2E2E34;
    --ink:#F5F5F7; --mut:#8E8E97;
    --accent:#CB3A31; --accent-soft:rgba(203,58,49,.16);
    --green:#32D74B; --gold:#FFC93E;
    --f:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--f);min-height:100%;-webkit-font-smoothing:antialiased}
  body{padding-bottom:100px}

  header{padding:26px 22px 10px}
  .htitle{font-size:22px;font-weight:800;letter-spacing:-.02em}

  main{padding:8px 22px 0}

  .datenav{display:flex;align-items:center;gap:10px;margin-top:10px;margin-bottom:16px}
  .navbtn{flex:0 0 auto;width:40px;height:40px;border-radius:13px;border:none;background:var(--panel);color:var(--ink);font-size:17px;font-weight:800;cursor:pointer}
  .datelabel{flex:1;text-align:center;font-weight:800;font-size:16px;letter-spacing:-.01em}
  .todaybtn{flex:0 0 auto;padding:10px 14px;border-radius:13px;border:none;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12.5px;font-family:var(--f);cursor:pointer}

  .card{background:var(--panel);border-radius:26px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
  h3{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px}

  .excard{background:var(--panel);border-radius:22px;padding:18px;margin-bottom:14px}
  .exhead{display:flex;align-items:center;gap:10px}
  .exname{font-weight:800;font-size:17px;letter-spacing:-.01em;flex:1}
  .exdel{flex:0 0 auto;background:none;border:none;color:var(--mut);font-size:18px;font-weight:800;cursor:pointer;padding:2px 6px}
  .exlast{font-size:13px;color:var(--green);font-weight:700;margin-top:8px}
  .setlist{margin-top:10px}
  .setrow2{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .setrow2:last-child{border-bottom:none}
  .setnum2{font-size:12.5px;font-weight:800;color:var(--mut);width:46px;flex:0 0 auto}
  .setval2{flex:1;font-size:14.5px;font-weight:700}
  .setundo{flex:0 0 auto;width:30px;height:30px;border-radius:10px;border:none;background:var(--panel2);color:var(--mut);font-weight:800;font-size:12px;cursor:pointer}
  .addset{display:flex;gap:8px;margin-top:12px}
  .addset input{padding:12px;border-radius:13px;border:none;background:var(--panel2);color:var(--ink);font-family:var(--f);font-weight:700;font-size:14px}
  .addset input[type=number]{width:72px;text-align:center}
  .addset input[type=text]{flex:1;min-width:0}
  .addset input::placeholder{color:#5E5E67;font-weight:600}
  .setok{flex:0 0 auto;width:40px;height:42px;border-radius:13px;border:none;background:var(--green);color:#0E0E11;font-weight:900;font-size:17px;cursor:pointer}

  .addexbtn{width:100%;padding:15px;border-radius:15px;border:none;background:var(--panel2);color:var(--ink);font-weight:800;font-size:14.5px;font-family:var(--f);cursor:pointer;margin-top:4px}
  .addexform{margin-top:10px;display:flex;gap:8px}
  .addexform.hide{display:none}
  .addexform input{flex:1;padding:14px;border-radius:14px;border:none;background:var(--panel2);color:var(--ink);font-family:var(--f);font-size:14.5px;font-weight:700;min-width:0}
  .addexform .mini{flex:0 0 auto;padding:14px 16px;border-radius:14px;border:none;background:var(--green);color:#0E0E11;font-weight:900;font-family:var(--f);font-size:14px;cursor:pointer}

  .empty{font-size:14px;color:var(--mut);font-weight:600;padding:20px 2px;text-align:center}

  .statrow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700}
  .statrow:last-child{border-bottom:none}
  .statrow span{color:var(--mut);font-weight:600}
  .statrow b{font-weight:900;text-align:right}

  .monthnav{display:flex;align-items:center;gap:10px;margin-top:10px;margin-bottom:16px}

  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(18,18,20,.9);backdrop-filter:blur(20px);
    border-top:1px solid var(--line);padding:11px 6px calc(12px + env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;border:none;color:var(--mut);font-family:var(--f);font-weight:700;
    font-size:10.5px;letter-spacing:.01em;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
  nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:var(--accent)}
  .hide{display:none}
</style>
</head>
<body>

<header>
  <div class="htitle">Training-Log</div>
</header>

<main>
  <section id="view-log">
    <div class="datenav">
      <button class="navbtn" onclick="prevDay()">‹</button>
      <div class="datelabel" id="dateLabel">…</div>
      <button class="navbtn" onclick="nextDay()">›</button>
      <button class="todaybtn hide" id="todayBtn" onclick="gotoToday()">Heute</button>
    </div>
    <div id="logList"></div>
    <button class="addexbtn" onclick="toggleAddEx()">+ Übung hinzufügen</button>
    <div class="addexform hide" id="addExForm">
      <input type="text" id="newExName" placeholder="Name der Übung" list="exNames"
        onkeydown="if(event.key==='Enter')confirmAddEx()">
      <datalist id="exNames"></datalist>
      <button class="mini" onclick="confirmAddEx()">+</button>
    </div>
  </section>

  <section id="view-month" class="hide">
    <div class="monthnav">
      <button class="navbtn" onclick="prevMonth()">‹</button>
      <div class="datelabel" id="monthLabel">…</div>
      <button class="navbtn" onclick="nextMonth()">›</button>
    </div>
    <div class="card">
      <h3>Überblick</h3>
      <div id="monthOverview"></div>
    </div>
    <div class="card">
      <h3>Pro Übung</h3>
      <div id="monthExList"></div>
    </div>
  </section>
</main>

<nav>
  <button id="tab-log" class="on"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Log</button>
  <button id="tab-month"><svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>Monat</button>
</nav>

<script>
/* ---------- Storage ---------- */
const hasCS=typeof window.storage!=="undefined"&&window.storage&&window.storage.get;
async function sget(k){
  if(hasCS){try{const r=await window.storage.get(k);return r&&r.value?JSON.parse(r.value):null}catch(e){return null}}
  try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}
}
async function sset(k,v){
  if(hasCS){try{await window.storage.set(k,JSON.stringify(v));return}catch(e){}}
  try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}
}

/* ---------- Datum-Helfer ---------- */
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const MN=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function todayKey(){return new Date().toISOString().slice(0,10)}
function fmtDate(k){
  const d=new Date(k+"T00:00:00");
  return WD[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
}
function fmtDateShort(k){
  const d=new Date(k+"T00:00:00");
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".";
}
function shiftDate(k,delta){
  const d=new Date(k+"T00:00:00");d.setDate(d.getDate()+delta);
  return d.toISOString().slice(0,10);
}
function shiftMonth(k,delta){
  const [y,m]=k.split("-").map(Number);
  const d=new Date(y,m-1+delta,1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function fmtMonth(k){
  const [y,m]=k.split("-").map(Number);
  return MN[m-1]+" "+y;
}
function fmtNum(n){return (Math.round(n*10)/10).toString();}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- State ---------- */
let S={log:{}};
let curDate=todayKey();
let curMonth=todayKey().slice(0,7);

/* ---------- Übungs-Helfer ---------- */
function normName(n){return n.trim().toLowerCase();}
function fmtSet(s){return (s.w!=null&&s.w!=="")?`${s.w} kg × ${s.r}`:`${s.r} Wdh`;}
function lastForExercise(name,beforeDate){
  const target=normName(name);
  const dates=Object.keys(S.log).filter(d=>d<beforeDate).sort().reverse();
  for(const d of dates){
    const ex=(S.log[d]||[]).find(e=>normName(e.name)===target);
    if(ex&&ex.sets&&ex.sets.length)return {date:d,sets:ex.sets};
  }
  return null;
}
function allExerciseNames(){
  const map=new Map();
  Object.keys(S.log).sort().forEach(d=>{
    (S.log[d]||[]).forEach(e=>{map.set(normName(e.name),e.name);});
  });
  return [...map.values()];
}

/* ---------- Mutationen ---------- */
window.toggleAddEx=()=>{
  const f=document.getElementById("addExForm");
  f.classList.toggle("hide");
  if(!f.classList.contains("hide")){
    const inp=document.getElementById("newExName");
    setTimeout(()=>inp.focus(),30);
  }
};
window.confirmAddEx=async()=>{
  const inp=document.getElementById("newExName");
  const name=inp.value.trim();
  if(!name)return;
  if(!S.log[curDate])S.log[curDate]=[];
  S.log[curDate].push({name,sets:[]});
  await sset("v3-log",S.log);
  inp.value="";
  document.getElementById("addExForm").classList.add("hide");
  renderLog();
};
window.deleteExercise=async(date,idx)=>{
  S.log[date].splice(idx,1);
  if(!S.log[date].length)delete S.log[date];
  await sset("v3-log",S.log);
  renderLog();
};
window.addSet=async(date,idx)=>{
  const wEl=document.getElementById("aw-"+idx),rEl=document.getElementById("ar-"+idx);
  if(!wEl||!rEl)return;
  const wRaw=wEl.value.trim(),r=rEl.value.trim();
  if(!r)return;
  const w=wRaw===""?null:parseFloat(wRaw);
  S.log[date][idx].sets.push({w,r});
  await sset("v3-log",S.log);
  renderLog();
};
window.deleteSet=async(date,idx,si)=>{
  S.log[date][idx].sets.splice(si,1);
  await sset("v3-log",S.log);
  renderLog();
};

/* ---------- Rendering: Log ---------- */
window.prevDay=()=>{curDate=shiftDate(curDate,-1);renderLog();};
window.nextDay=()=>{curDate=shiftDate(curDate,1);renderLog();};
window.gotoToday=()=>{curDate=todayKey();renderLog();};

function renderLog(){
  const listEl=document.getElementById("logList");
  const saved={};
  if(listEl)listEl.querySelectorAll("input[id]").forEach(i=>{saved[i.id]=i.value;});

  document.getElementById("dateLabel").textContent=fmtDate(curDate)+(curDate===todayKey()?" · Heute":"");
  document.getElementById("todayBtn").classList.toggle("hide",curDate===todayKey());

  const list=S.log[curDate]||[];
  let h="";
  if(!list.length){
    h+=`<div class="empty">Noch keine Übungen für diesen Tag.<br>Leg los mit „+ Übung hinzufügen".</div>`;
  }
  list.forEach((ex,idx)=>{
    const last=lastForExercise(ex.name,curDate);
    h+=`<div class="excard">
      <div class="exhead">
        <div class="exname">${esc(ex.name)}</div>
        <button class="exdel" onclick="deleteExercise('${curDate}',${idx})">✕</button>
      </div>
      ${last?`<div class="exlast">Letztes Mal (${fmtDateShort(last.date)}): ${last.sets.map(fmtSet).join(" · ")}</div>`:""}
      ${ex.sets.length?`<div class="setlist">${ex.sets.map((s,si)=>
        `<div class="setrow2">
          <span class="setnum2">Satz ${si+1}</span>
          <span class="setval2">${fmtSet(s)}</span>
          <button class="setundo" onclick="deleteSet('${curDate}',${idx},${si})">✕</button>
        </div>`).join("")}</div>`:""}
      <div class="addset">
        <input type="number" step="0.5" placeholder="kg" id="aw-${idx}">
        <input type="text" placeholder="Wdh" id="ar-${idx}" onkeydown="if(event.key==='Enter')addSet('${curDate}',${idx})">
        <button class="setok" onclick="addSet('${curDate}',${idx})">✓</button>
      </div>
    </div>`;
  });
  listEl.innerHTML=h;
  Object.keys(saved).forEach(id=>{const el=document.getElementById(id);if(el&&saved[id])el.value=saved[id];});

  document.getElementById("exNames").innerHTML=allExerciseNames().map(n=>`<option value="${esc(n)}">`).join("");
}

/* ---------- Rendering: Monat ---------- */
function monthStats(){
  const dates=Object.keys(S.log).filter(d=>d.startsWith(curMonth)).sort();
  let totalVol=0,totalSets=0;
  const perEx={};
  dates.forEach(d=>{
    (S.log[d]||[]).forEach(ex=>{
      const key=normName(ex.name);
      if(!perEx[key])perEx[key]={name:ex.name,sets:0,maxW:null};
      (ex.sets||[]).forEach(s=>{
        totalSets++;
        perEx[key].sets++;
        if(s.w!=null){
          totalVol+=s.w*(parseFloat(s.r)||0);
          if(perEx[key].maxW===null||s.w>perEx[key].maxW)perEx[key].maxW=s.w;
        }
      });
    });
  });
  return {days:dates.length,totalVol,totalSets,perEx:Object.values(perEx).sort((a,b)=>b.sets-a.sets)};
}
window.prevMonth=()=>{curMonth=shiftMonth(curMonth,-1);renderMonth();};
window.nextMonth=()=>{curMonth=shiftMonth(curMonth,1);renderMonth();};
function renderMonth(){
  document.getElementById("monthLabel").textContent=fmtMonth(curMonth);
  const st=monthStats();
  document.getElementById("monthOverview").innerHTML=
    `<div class="statrow"><span>Trainingstage</span><b>${st.days}</b></div>
     <div class="statrow"><span>Gesamtvolumen</span><b>${fmtNum(st.totalVol)} kg</b></div>
     <div class="statrow"><span>Sätze gesamt</span><b>${st.totalSets}</b></div>`;
  document.getElementById("monthExList").innerHTML=st.perEx.length?
    st.perEx.map(e=>`<div class="statrow"><span>${esc(e.name)}</span><b>${e.sets} Sätze${e.maxW!=null?" · max "+fmtNum(e.maxW)+" kg":""}</b></div>`).join(""):
    '<div class="empty">Noch keine Daten in diesem Monat.</div>';
}

/* ---------- Tabs ---------- */
const tabs={log:"view-log",month:"view-month"};
Object.keys(tabs).forEach(t=>{
  document.getElementById("tab-"+t).onclick=()=>{
    Object.keys(tabs).forEach(x=>{
      document.getElementById(tabs[x]).classList.toggle("hide",x!==t);
      document.getElementById("tab-"+x).classList.toggle("on",x===t);
    });
    if(t==="log")renderLog();
    if(t==="month")renderMonth();
  };
});

/* ---------- Einmaliges Seeding (03.11.2026) ---------- */
const SEED_DATE="2026-11-03";
const SEED_EX=[
  {name:"Bankdrücken",sets:[{w:70,r:"7"}]},
  {name:"Schulterdrücken",sets:[{w:55,r:"10"}]},
  {name:"Seitheben Maschine",sets:[{w:70,r:"9-10"}]},
  {name:"Butterfly",sets:[{w:70,r:"12"},{w:70,r:"10"}]},
  {name:"Optimale Trizepsübung",sets:[{w:35,r:"13"},{w:35,r:"13"},{w:35,r:"13"}]},
  {name:"Trizeps-Pushdown einarmig",sets:[{w:25,r:"10-11"}]}
];

/* ---------- Boot ---------- */
async function boot(){
  S.log=(await sget("v3-log"))||{};
  const seeded=await sget("v3-seed-20261103");
  if(!seeded){
    if(!S.log[SEED_DATE]||!S.log[SEED_DATE].length){
      S.log[SEED_DATE]=SEED_EX.map(e=>({name:e.name,sets:e.sets.map(s=>({w:s.w,r:s.r}))}));
      await sset("v3-log",S.log);
    }
    await sset("v3-seed-20261103",true);
  }
  curDate=todayKey();curMonth=todayKey().slice(0,7);
  renderLog();
}
boot();
</script>
</body>
</html>
